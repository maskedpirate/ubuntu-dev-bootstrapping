---
# -----------------------------------------------------------------------
# dnsmasq: just the package. Per-project KinD DNS entries (e.g. tektoncd's
# *.lab.devkit/*.core.devkit split) are provisioned by each project's own
# tooling now, not here -- this role previously wrote a generic
# /etc/dnsmasq.d/devkit.conf wildcard that collided with and periodically
# clobbered tektoncd's Terraform-managed config at that same path.
# -----------------------------------------------------------------------

- name: Install dnsmasq and dnsutils
  become: true
  apt:
    name:
      - dnsmasq
      - dnsutils
    state: present
