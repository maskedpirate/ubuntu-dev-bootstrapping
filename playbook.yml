---
- name: Bootstrap KinD Development Environment
  hosts: localhost
  connection: local
  gather_facts: true

  pre_tasks:
    - name: Check for classic GNU sudo binary
      # Some Ubuntu releases default /usr/bin/sudo (via update-alternatives) to
      # sudo-rs, which doesn't echo Ansible's custom become prompt the way GNU
      # sudo does, so `-K` never gets past the first task. Classic sudo, when
      # installed alongside sudo-rs, lives at /usr/bin/sudo.ws. Only override
      # when it's actually present so this stays a no-op on hosts without
      # sudo-rs installed.
      stat:
        path: /usr/bin/sudo.ws
      register: _classic_sudo
      become: false

    - name: Use classic sudo for privilege escalation when sudo-rs is the system default
      set_fact:
        ansible_become_exe: /usr/bin/sudo.ws
      when: _classic_sudo.stat.exists and _classic_sudo.stat.executable

  roles:
    - base
    - github_cli
    - docker
    - kubernetes_tools
    - kubie
    - tekton
    - terraform
    - nodejs
    - claude_code
    - shell_config
    - gnome_tiling
    - kind_dns
