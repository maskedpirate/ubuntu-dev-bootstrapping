---
- name: Bootstrap KinD Development Environment
  hosts: localhost
  connection: local

  vars:
    kind_version: "v0.23.0"
    kubectl_version: "v1.30.0"
    tkn_version: "v0.45.1"
    nvm_version: "v0.39.7"
    # Detect original user if run via sudo, otherwise use the current user
    target_user: "{{ lookup('env', 'SUDO_USER') | default(lookup('env', 'USER'), true) }}"
    # Dynamically set the home path based on the detected user
    target_home: "{{ '/root' if target_user == 'root' else '/home/' + target_user }}"
    #
    # The official unique identifier for Tiling Assistant
    tiling_extension_uuid: "tiling-assistant@leleat-on-github"

    
  tasks:
    - name: Update apt cache
      become: true
      apt:
        update_cache: yes

    - name: Install base packages
      become: true
      apt:
        name:
          - apt-transport-https
          - bash-completion
          - ca-certificates
          - gnupg
          - lsb-release
          - tree
          - git
          - gnome-browser-connector
          - gnome-shell-extension-manager
        state: present
    
    - name: Install Vim text editor
      become: true
      apt:
        name: vim
        state: present

    - name: Add GitHub CLI GPG key and repository
      become: true
      shell: |
        curl -fsSL https://cli.github.com/packages/githubcli-archive-keyring.gpg | dd of=/usr/share/keyrings/githubcli-archive-keyring.gpg
        chmod go+r /usr/share/keyrings/githubcli-archive-keyring.gpg
        echo "deb [arch=$(dpkg --print-architecture) signed-by=/usr/share/keyrings/githubcli-archive-keyring.gpg] https://cli.github.com/packages stable main" > /etc/apt/sources.list.d/github-cli.list
      args:
        creates: /etc/apt/sources.list.d/github-cli.list

    - name: Install Docker and GitHub CLI
      become: true
      apt:
        name: 
          - docker.io
          - gh
        state: present
        update_cache: yes

    - name: Ensure Docker service is running
      become: true
      service:
        name: docker
        state: started
        enabled: yes

    - name: Ensure Docker service is running
      become: true
      service:
        name: docker
        state: started
        enabled: yes

    - name: Add target user to the docker group
      become: true
      user:
        name: "{{ target_user }}"
        groups: docker
        append: yes

    - name: Download and install KinD
      become: true
      get_url:
        url: "https://kind.sigs.k8s.io/dl/{{ kind_version }}/kind-linux-amd64"
        dest: /usr/local/bin/kind
        mode: '0755'

    - name: Download and install kubectl
      become: true
      get_url:
        url: "https://dl.k8s.io/release/{{ kubectl_version }}/bin/linux/amd64/kubectl"
        dest: /usr/local/bin/kubectl
        mode: '0755'

    - name: Install Helm
      become: true
      shell: curl -fsSL https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3 | bash
      args:
        creates: /usr/local/bin/helm

    - name: Download and install Kubie
      become: true
      get_url:
        url: "https://github.com/kubie-org/kubie/releases/download/v0.28.0/kubie-linux-amd64"
        dest: /usr/local/bin/kubie
        mode: '0755'

    - name: Ensure Kubie config directory exists
      become: true
      become_user: "{{ target_user }}"
      file:
        path: "{{ target_home }}/.config/kubie"
        state: directory
        mode: '0755'

    - name: Configure Kubie to disable default prompt modification
      become: true
      become_user: "{{ target_user }}"
      copy:
        dest: "{{ target_home }}/.config/kubie/kubie.yaml"
        content: |
          prompt:
            disable: true

    - name: Deploy dynamic bash completion for kubie
      ansible.builtin.copy:
        dest: /etc/bash_completion.d/kubie
        owner: root
        group: root
        mode: '0644'
        content: |
          #!/usr/bin/env bash
          _kubie_completions() {
              local cur prev words cword
              _init_completion || return

              local cmd="${words[1]}"

              case "$cmd" in
                  ctx)
                      if [[ "$cur" == -* ]]; then
                          COMPREPLY=($(compgen -W "-u --unset -f --fish -z --zsh" -- "$cur"))
                          return 0
                      fi
                      local contexts=""
                      if command -v kubectl >/dev/null 2>&1; then
                          contexts=$(kubectl config get-contexts --no-headers -o name 2>/dev/null)
                      elif [[ -f "${KUBECONFIG:-$HOME/.kube/config}" ]]; then
                          contexts=$(grep -E '^\s*-\s*name:' "${KUBECONFIG:-$HOME/.kube/config}" | awk '{print $NF}')
                      fi
                      COMPREPLY=($(compgen -W "$contexts" -- "$cur"))
                      return 0
                      ;;
                  ns)
                      if [[ "$cur" == -* ]]; then
                          COMPREPLY=($(compgen -W "-f --fish -z --zsh" -- "$cur"))
                          return 0
                      fi
                      local target_ctx=""
                      for ((i = 2; i < cword; i++)); do
                          if [[ "${words[i]}" == "-c" || "${words[i]}" == "--context" ]]; then
                              target_ctx="${words[i+1]}"
                              break
                          fi
                      done
                      local ns_list=""
                      if command -v kubectl >/dev/null 2>&1; then
                          local ctx_arg=()
                          [[ -n "$target_ctx" ]] && ctx_arg=(--context "$target_ctx")
                          ns_list=$(kubectl get namespaces "${ctx_arg[@]}" --no-headers -o custom-columns=":metadata.name" 2>/dev/null)
                      fi
                      COMPREPLY=($(compgen -W "$ns_list" -- "$cur"))
                      return 0
                      ;;
                  *)
                      if [[ $cword -eq 1 ]]; then
                          COMPREPLY=($(compgen -W "ctx ns exec edit lint info update help" -- "$cur"))
                          return 0
                      fi
                      ;;
              esac
          }
          complete -F _kubie_completions kubie

    - name: Install kube-ps1 prompt helper
      become: true
      become_user: "{{ target_user }}"
      file:
        path: "{{ target_home }}/.local/share"
        state: directory
        mode: '0755'

    - name: Download kube-ps1 prompt helper script
      become: true
      become_user: "{{ target_user }}"
      get_url:
        url: "https://raw.githubusercontent.com/jonmosco/kube-ps1/master/kube-ps1.sh"
        dest: "{{ target_home }}/.local/share/kube-ps1.sh"
        mode: '0644'

    - name: Install NVM, Node 24, and set as default
      become: true
      become_user: "{{ target_user }}"
      shell: |
        curl -o- https://raw.githubusercontent.com/nvm-sh/nvm/{{ nvm_version }}/install.sh | bash
        export NVM_DIR="{{ target_home }}/.nvm"
        [ -s "$NVM_DIR/nvm.sh" ] && \. "$NVM_DIR/nvm.sh"
        nvm install 24
        nvm alias default 24
      args:
        executable: /bin/bash
        creates: "{{ target_home }}/.nvm/nvm.sh"

    - name: Install Fireworks AI Connect (FireConnect)
      become: true
      become_user: "{{ target_user }}"
      shell: |
        export NVM_DIR="{{ target_home }}/.nvm"
        [ -s "$NVM_DIR/nvm.sh" ] && \. "$NVM_DIR/nvm.sh"
        curl -fsSL https://fireconnect.fireworks.ai/install.sh | bash
      args:
        executable: /bin/bash
        creates: "{{ target_home }}/.local/bin/fireconnect"

    - name: Install Smee CLI globally with npm
      become: true
      become_user: "{{ target_user }}"
      shell: |
        export NVM_DIR="{{ target_home }}/.nvm"
        [ -s "$NVM_DIR/nvm.sh" ] && \. "$NVM_DIR/nvm.sh"
        npm install -g smee-client
      args:
        executable: /bin/bash
        creates: "{{ target_home }}/.local/bin/smee"

    - name: Install Tekton CLI (tkn)
      become: true
      shell: |
        curl -fsSL "https://github.com/tektoncd/cli/releases/download/{{ tkn_version }}/tkn_{{ tkn_version | regex_replace('^v', '') }}_Linux_x86_64.tar.gz" -o /tmp/tkn.tar.gz
        tar -xzf /tmp/tkn.tar.gz -C /tmp
        install -m 0755 /tmp/tkn /usr/local/bin/tkn
        rm -f /tmp/tkn /tmp/tkn.tar.gz
      args:
        executable: /bin/bash
        creates: /usr/local/bin/tkn

    - name: Install ko
      become: true
      shell: |
        curl -fsSL "https://github.com/ko-build/ko/releases/download/v0.19.1/ko_0.19.1_Linux_x86_64.tar.gz" -o /tmp/ko.tar.gz
        tar -xzf /tmp/ko.tar.gz -C /tmp
        install -m 0755 /tmp/ko /usr/local/bin/ko
        rm -f /tmp/ko /tmp/ko.tar.gz
      args:
        executable: /bin/bash
        creates: /usr/local/bin/ko

    - name: Install kustomize
      become: true
      shell: |
        curl -fsSL https://raw.githubusercontent.com/kubernetes-sigs/kustomize/master/hack/install_kustomize.sh | bash
        install -m 0755 kustomize /usr/local/bin/kustomize
      args:
        executable: /bin/bash
        creates: /usr/local/bin/kustomize

    - name: Configure Git aliases
      become: true
      become_user: "{{ target_user }}"
      environment:
        HOME: "{{ target_home }}"
      shell: |
        git config --global alias.co checkout
        git config --global alias.cm "commit -m"
        git config --global alias.rv "remote -vv"
        git config --global alias.bv "branch -avv"
        git config --global alias.st status
        git config --global diff.tool vimdiff
        git config --global difftool.prompt false

    - name: Configure kubectl alias and bash completion
      become: true
      become_user: "{{ target_user }}"
      blockinfile:
        path: "{{ target_home }}/.bashrc"
        marker: "# {mark} ANSIBLE MANAGED BLOCK - KUBECTL ALIAS"
        content: |
          # Enable bash completion for kubectl and alias it to k
          if [ -f /etc/bash_completion ]; then
            . /etc/bash_completion
          fi

          if command -v kubectl >/dev/null 2>&1; then
            alias k='kubectl'
            source <(kubectl completion bash)
            complete -o default -F __start_kubectl k
          fi

    - name: Configure custom multi-line bash prompt with Git and K8s context
      become: true
      become_user: "{{ target_user }}"
      blockinfile:
        path: "{{ target_home }}/.bashrc"
        marker: "# {mark} ANSIBLE MANAGED BLOCK - CUSTOM PROMPT"
        content: |
          # Load Git prompt functionality (included with Ubuntu git package)
          if [ -f /usr/lib/git-core/git-sh-prompt ]; then
            source /usr/lib/git-core/git-sh-prompt
            export GIT_PS1_SHOWDIRTYSTATE=1
          fi

          if [ -f "{{ target_home }}/.local/share/kube-ps1.sh" ]; then
            source "{{ target_home }}/.local/share/kube-ps1.sh"
          fi

          function _custom_multiline_prompt() {
            local reset="\[\e[0m\]"
            local path_color="\[\e[36m\]"  # Cyan
            local user_color="\[\e[32m\]"  # Green
            local ctx_color="\[\e[34m\]"   # Blue
            local git_color="\[\e[33m\]"   # Yellow

            # Line 1: Full absolute directory path
            local line1="${path_color}${PWD}${reset}"

            # Line 2: User
            local line2="${user_color}\u${reset}"

            local kube_prompt=""
            if type kube_ps1 >/dev/null 2>&1; then
              kube_prompt="$(kube_ps1)"
            fi

            if [ -z "$kube_prompt" ] && command -v kubectl >/dev/null 2>&1; then
              local kube_context
              kube_context="$(kubectl config current-context 2>/dev/null || true)"
              if [ -n "$kube_context" ]; then
                local kube_namespace
                kube_namespace="$(kubectl config view --minify --output 'jsonpath={..namespace}' 2>/dev/null || true)"
                if [ -z "$kube_namespace" ]; then
                  kube_namespace="default"
                fi
                kube_prompt="[k8s: ${kube_context}|${kube_namespace}]"
              fi
            fi

            if [ -n "$kube_prompt" ]; then
              line2="${line2} ${ctx_color}${kube_prompt}${reset}"
            fi

            # Append Git context if in a repository
            if type __git_ps1 >/dev/null 2>&1; then
              local git_info
              git_info=$(__git_ps1 ' [git: %s]')
              if [ -n "$git_info" ]; then
                line2="${line2}${git_color}${git_info}${reset}"
              fi
            fi

            # Set the PS1 with a standard ($) prompt character
            PS1="\n${line1}\n${line2} $ "
          }
          PROMPT_COMMAND="_custom_multiline_prompt"

    - name: Ensure GNOME extensions local directory exists
      ansible.builtin.file:
        path: "{{ target_home }}/.local/share/gnome-shell/extensions/{{ tiling_extension_uuid }}"
        state: directory
        mode: '0755'
        owner: "{{ target_user }}"
        group: "{{ target_user }}"
        group: root
      become_user: "{{ target_user }}"

    - name: Download and extract Tiling Assistant extension
      ansible.builtin.unarchive:
        src: "https://extensions.gnome.org/extension-data/tiling-assistantleleat-on-github.v54.shell-extension.zip"
        dest: "{{ target_home }}/.local/share/gnome-shell/extensions/{{ tiling_extension_uuid }}"
        remote_src: yes
        owner: "{{ target_user }}"
        group: "{{ target_user }}"
      become_user: "{{ target_user }}"

    - name: Enable the Tiling Assistant extension
      ansible.builtin.command: "gnome-extensions enable {{ tiling_extension_uuid }}"
      register: extension_enable_result
      become_user: "{{ target_user }}"
      changed_when: "'already enabled' not in extension_enable_result.stderr"
      failed_when: false

